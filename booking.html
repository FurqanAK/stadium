<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IPL Ticket Booking Form</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f4f8;
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 450px;
            margin: 30px auto;
            background-color: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }

        h1 {
            text-align: center;
            color: #1a237e;
        }

        label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
        }

        input, select {
            width: 100%;
            padding: 10px;
            margin-top: 8px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        .radio-option {
            margin-top: 12px;
        }

        .radio-option input {
            width: auto;
        }

        .radio-option label {
            display: inline;
            font-weight: normal;
        }

        .buttons {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        button {
            width: 50%;
            padding: 12px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        .submit-btn {
            background-color: #1a237e;
            color: white;
        }

        .reset-btn {
            background-color: #ccc;
        }

        .home-link {
            display: block;
            text-align: center;
            margin-top: 20px;
            text-decoration: none;
            color: #1a237e;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>IPL Ticket Booking</h1>

        <form>

            <label for="name">Full Name</label>
            <input type="text" id="name" name="name"
                   placeholder="Enter your name"
                   minlength="3" maxlength="30" required>

            <label for="email">Email</label>
            <input type="email" id="email" name="email"
                   placeholder="Enter your email"
                   required>

            <label for="phone">Phone Number</label>
            <input type="tel" id="phone" name="phone"
                   placeholder="10-digit mobile number"
                   pattern="[0-9]{10}"
                   title="Enter a valid 10-digit phone number"
                   required>

            <label for="match">Select Match</label>
            <select id="match" name="match" required>
                <option value="">-- Select Match --</option>
                <option>RCB vs CSK</option>
                <option>MI vs RCB</option>
                <option>CSK vs MI</option>
                <option>KKR vs RCB</option>
                <option>SRH vs MI</option>
            </select>

            <label for="stand">Stand Category</label>
            <select id="stand" name="stand" required>
                <option value="">-- Select Stand --</option>
                <option>General Stand</option>
                <option>Premium Stand</option>
                <option>VIP Stand</option>
                <option>Corporate Box</option>
            </select>

            <label for="tickets">Number of Tickets</label>
            <input type="number" id="tickets" name="tickets"
                   min="1" max="10" required>

            <label>Booking Preference</label>

            <div class="radio-option">
                <input type="radio" id="regular" name="preference"
                       value="Regular" required>
                <label for="regular">Regular Booking</label>
            </div>

            <div class="radio-option">
                <input type="radio" id="family" name="preference"
                       value="Family">
                <label for="family">Family Booking</label>
            </div>

            <div class="buttons">
                <button type="submit" class="submit-btn">Book Tickets</button>
                <button type="reset" class="reset-btn">Reset</button>
            </div>

        </form>

        <a href="index.html" class="home-link">← Back to Home</a>

    </div>

</body>
</html>
